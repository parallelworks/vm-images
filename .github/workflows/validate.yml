name: Validate

on:
  pull_request:
  push:
    branches:
      - canary

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PACKER_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.14.2

      - name: Packer fmt
        run: packer fmt -check -recursive -diff .

      - name: Packer init
        run: packer init rocky-9/

      - name: Packer validate
        run: |
          for cloud in aws azure google oracle; do
            echo "validating ${cloud}"
            packer validate -var "cloud=${cloud}" -var accelerator=tcg rocky-9/
          done

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Partition size check rejects an undersized disk
        env:
          DISK_SIZE_GB: "50"
          ROOT_GB: "50"
          VAR_GB: "15"
          VAR_LOG_GB: "8"
          VAR_LOG_AUDIT_GB: "3"
          VAR_TMP_GB: "5"
          TMP_GB: "8"
        run: |
          if ./scripts/check-sizes.sh > /dev/null; then
            echo "::error::check-sizes.sh accepted a disk smaller than the fixed partitions"
            exit 1
          fi
